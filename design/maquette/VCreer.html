<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OKARE — Nouveau point de vente (vendeur)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF7F2; font-family: Inter, sans-serif; color: #1C1917; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="VPoints.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid #EDE7DF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1917" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
      <div><h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">Nouveau point de vente</h1><div style="font-size: 13px; color: #57534E">Étape 2 sur 4 · Où te trouver ?</div></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px"><div style="height: 6px; border-radius: 999px; background: #C2410C"></div><div style="height: 6px; border-radius: 999px; background: #C2410C"></div><div style="height: 6px; border-radius: 999px; background: #E7E0D6"></div><div style="height: 6px; border-radius: 999px; background: #E7E0D6"></div></div>

    <div style="font-size: 13px; font-weight: 700; color: #44403C">Type</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button style="min-height: 64px; border-radius: 14px; border: 1px solid #D6CFC6; background: #FFFFFF; font: 600 13px Inter, sans-serif; color: #1C1917">Particulier<span style="display: block; font-size: 11px; font-weight: 400; color: #57534E">je vends en ligne</span></button>
      <button style="min-height: 64px; border-radius: 14px; border: 2px solid #C2410C; background: #FFF7ED; font: 700 13px Inter, sans-serif; color: #7C2D12">Maquis<span style="display: block; font-size: 11px; font-weight: 400">ou étal</span></button>
      <button style="min-height: 64px; border-radius: 14px; border: 1px solid #D6CFC6; background: #FFFFFF; font: 600 13px Inter, sans-serif; color: #1C1917">Restaurant</button>
    </div>

    <div style="height: 190px; border-radius: 16px; background: #EEE9E0; position: relative; overflow: hidden">
      <svg width="100%" height="100%" viewBox="0 0 350 190" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0" aria-hidden="true"><g stroke="#FFFFFF" stroke-width="10" fill="none"><path d="M-10 70 L360 120"/><path d="M140 -10 L180 200"/></g></svg>
      <svg width="34" height="34" viewBox="0 0 24 24" style="position: absolute; left: 50%; top: 50%; margin: -32px 0 0 -17px" fill="#C2410C" stroke="#FFFFFF" stroke-width="1.5" role="img" aria-label="Position du point de vente"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5" fill="#FFFFFF"/></svg>
      <div style="position: absolute; left: 12px; bottom: 12px; right: 12px; background: #FFFFFF; border-radius: 10px; padding: 8px 10px; font-size: 12px; color: #44403C">Déplace la carte pour placer l'épingle sur ton entrée</div>
    </div>
    <button style="min-height: 46px; border-radius: 12px; border: 1px solid #15803D; background: #FFFFFF; color: #15803D; font: 600 14px Inter, sans-serif">Utiliser ma position actuelle</button>
    <div style="display: flex; flex-direction: column; gap: 6px"><label for="vr" style="font-size: 13px; font-weight: 600; color: #44403C">Repère (pour que les clients te trouvent)</label><input id="vr" placeholder="ex. face à la station, derrière la pharmacie…" style="min-height: 46px; border-radius: 12px; border: 1px solid #D6CFC6; padding: 0 14px; font: 400 15px Inter, sans-serif"></div>
    <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: #44403C"><input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #C2410C; flex-shrink: 0">Je vends depuis chez moi : ne pas afficher mon adresse (quartier seulement)</label>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
      <a href="VCreerHoraires.html" style="min-height: 54px; border-radius: 16px; background: #C2410C; color: #FFFFFF; font: 700 16px Inter, sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none">Continuer : horaires</a>
      <div style="font-size: 12px; color: #57534E; text-align: center">Ton point est publié dès que tu l'envoies. Gratuit.</div>
    </div>
  </div>
</div>
</body>
</html>
