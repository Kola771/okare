<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OKARE — Inscription avant contact</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #6B625A; font-family: Inter, sans-serif; color: #1C1917; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">
  <div style="background: #FFFFFF; border-radius: 26px 26px 0 0; padding: 14px 22px 28px; display: flex; flex-direction: column; gap: 16px">
    <div style="width: 44px; height: 5px; border-radius: 999px; background: #D6CFC6; align-self: center"></div>
    <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.15">Une dernière étape avant de commander</div>
    <div style="font-size: 15px; line-height: 1.5; color: #57534E">Crée ton compte en 10 secondes. Tu pourras contacter tous les vendeurs, garder tes favoris et recevoir les plats du jour de ton quartier.</div>

    <button style="min-height: 52px; border-radius: 14px; border: 1px solid #D6CFC6; background: #FFFFFF; font: 600 15px Inter, sans-serif; color: #1C1917; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1917" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 12h8M12 3a9 9 0 0 1 0 18"/></svg>
      Continuer avec Google
    </button>

    <div style="display: flex; align-items: center; gap: 12px; color: #78716C; font-size: 13px">
      <div style="flex: 1; height: 1px; background: #EDE7DF"></div>ou avec ton numéro<div style="flex: 1; height: 1px; background: #EDE7DF"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="tel" style="font-size: 13px; font-weight: 600; color: #44403C">Numéro de téléphone</label>
      <div style="display: flex; gap: 8px">
        <div style="min-height: 50px; padding: 0 12px; border-radius: 12px; background: #F5EFE7; display: flex; align-items: center; font-weight: 600">+229</div>
        <input id="tel" placeholder="01 XX XX XX XX" style="flex: 1; min-height: 50px; border-radius: 12px; border: 1px solid #D6CFC6; padding: 0 14px; font: 400 16px Inter, sans-serif; color: #1C1917">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="mdp" style="font-size: 13px; font-weight: 600; color: #44403C">Mot de passe</label>
      <input id="mdp" type="password" placeholder="6 caractères minimum" style="min-height: 50px; border-radius: 12px; border: 1px solid #D6CFC6; padding: 0 14px; font: 400 16px Inter, sans-serif; color: #1C1917">
    </div>

    <button style="min-height: 54px; border-radius: 16px; border: 0; background: #C2410C; color: #FFFFFF; font: 700 16px Inter, sans-serif">Créer mon compte et commander</button>
    <div style="font-size: 12px; line-height: 1.5; color: #57534E; text-align: center">Ton nom complet te sera demandé plus tard. En continuant, tu acceptes les <a href="#">conditions d'utilisation</a>.</div>
  </div>
</div>
</body>
</html>
