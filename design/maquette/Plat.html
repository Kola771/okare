<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OKARE — Publier ou modifier un plat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF7F2; font-family: Inter, sans-serif; color: #1C1917; display: flex; flex-direction: column; gap: 14px; padding: 22px 20px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px">
    <a href="Menu.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid #EDE7DF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1917" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">Modifier le plat</div>
  </div>

  <button style="height: 150px; border-radius: 18px; border: 2px dashed #D6CFC6; background: #F3E3D3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 600 14px Inter, sans-serif; color: #44403C">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    Changer la photo
  </button>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="np" style="font-size: 13px; font-weight: 600; color: #44403C">Nom du plat</label>
    <input id="np" value="Riz sauce arachide" style="min-height: 48px; border-radius: 12px; border: 1px solid #D6CFC6; padding: 0 14px; font: 400 15px Inter, sans-serif; color: #1C1917">
  </div>
  <div style="display: flex; gap: 8px">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
      <label for="px" style="font-size: 13px; font-weight: 600; color: #44403C">Prix (FCFA)</label>
      <input id="px" value="900" style="min-height: 48px; border-radius: 12px; border: 1px solid #D6CFC6; padding: 0 14px; font: 600 15px Inter, sans-serif; color: #15803D; min-width: 0">
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
      <label for="cat" style="font-size: 13px; font-weight: 600; color: #44403C">Moment</label>
      <select id="cat" style="min-height: 48px; border-radius: 12px; border: 1px solid #D6CFC6; padding: 0 10px; font: 400 15px Inter, sans-serif; background: #FFFFFF; color: #1C1917"><option>Déjeuner</option><option>Petit-déj</option><option>Dîner</option></select>
    </div>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #EDE7DF; border-radius: 14px; padding: 4px 14px; display: flex; flex-direction: column">
    <label style="display: flex; justify-content: space-between; align-items: center; min-height: 50px; font-size: 14px; font-weight: 600">Plat du jour<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #C2410C"></label>
    <div style="height: 1px; background: #EDE7DF"></div>
    <label style="display: flex; justify-content: space-between; align-items: center; min-height: 50px; font-size: 14px; font-weight: 600">Disponible maintenant<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #15803D"></label>
    <div style="height: 1px; background: #EDE7DF"></div>
    <label style="display: flex; justify-content: space-between; align-items: center; min-height: 50px; font-size: 14px; font-weight: 600">Offre spéciale (payée par toi)<input type="checkbox" style="width: 22px; height: 22px; accent-color: #C2410C"></label>
  </div>

  <div style="display: flex; gap: 10px; margin-top: auto">
    <button style="min-height: 54px; padding: 0 16px; border-radius: 16px; border: 1px solid #FCA5A5; background: #FFFFFF; color: #B91C1C; font: 700 15px Inter, sans-serif; display: flex; align-items: center; gap: 6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Supprimer</button>
    <button style="flex: 1; min-height: 54px; border-radius: 16px; border: 0; background: #C2410C; color: #FFFFFF; font: 700 16px Inter, sans-serif">Enregistrer</button>
  </div>
</div>
</body>
</html>
